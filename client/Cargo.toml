[package]
name = "sandom-gamestream-client"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause AND Apache-2.0"
publish = false
description = "A GameStream client for Sandom GameStream servers: pairing, sessions, video frames and input."

# The Rust crate, and the C interface of src/native.rs for host plugins.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
aws-lc-rs = "1.17.0"
hex = "0.4.3"
rustls = "0.23.40"
rustls-pemfile = "2.2.0"
sandom-gamestream-protocol = { path = "../protocol" }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-enet = "0.1.0"
tracing = "0.1.44"

[dev-dependencies]
sandom-gamestream = { path = ".." }
tempfile = "3.27.0"
tracing-subscriber = "0.3"
