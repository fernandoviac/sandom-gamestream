[package]
name = "sandom-gamestream"
version = "0.2.0"
edition = "2024"
license = "BSD-2-Clause AND Apache-2.0"
publish = false

# The library: the Rust crate, and the C interface of src/native.rs for
# Deno's FFI and the Node-API addon of node/.
[lib]
crate-type = ["rlib", "cdylib"]

[workspace]
members = [".", "client", "node", "protocol"]
exclude = ["vendor/tokio-enet"]

# tokio-enet 0.1.1 with ENet's retransmission timeout (docs/legal/tokio-enet.md).
[patch.crates-io]
tokio-enet = { path = "vendor/tokio-enet" }

[dependencies]
anyhow = "1"
sandom-gamestream-protocol = { path = "protocol" }
async-shutdown = "0.2.2"
aws-lc-rs = "1.17.0"
byteorder = "1.5.0"
bytes = "1.11.1"
cbc = "0.2.1"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
inout = "0.2.2"
quinn-udp = "0.6.1"
rtsp-types = "0.1.3"
rustls = "0.23.40"
rustls-pemfile = "2.2.0"
sdp-types = "0.1.8"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
socket2 = "0.6.4"
strum_macros = "0.28.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-enet = "0.1.0"
tokio-rustls = "0.26.4"
toml = "1.1.2"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"

# Reed-Solomon matrices (the server's encoder warm-up builds one per block
# size at each session start) and RSA key generation take minutes
# unoptimized; debug builds and tests optimize these crates.
[profile.dev.package.fec-rs]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
