# The licences that the native libraries may contain: the permissive licences
# that the owner's licensing policy permits for third-party code. A crate
# under any other licence makes `cargo about generate` fail, and with it
# tools/stage-packages.js.
accepted = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Apache-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "NCSA",
]
# Build-time crates (bindgen, the proc-macro crates) do not enter the
# libraries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
